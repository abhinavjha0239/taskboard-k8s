# One node to keep a laptop responsive; `make cluster` also caps it at
# 2 CPUs / 3 GB with `docker update`. Ports are published on 127.0.0.1 only.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: taskboard
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # Taskboard
        hostPort: 8080
        listenAddress: "127.0.0.1"
