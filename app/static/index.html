<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { margin-bottom: 24px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type=text] { flex: 1; padding: 8px; font-size: 15px; }
    button { padding: 8px 14px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eee; }
    li.done span { text-decoration: line-through; color: #999; }
    li span { flex: 1; }
    .err { color: #b00020; }
  </style>
</head>
<body>
  <h1>Taskboard</h1>
  <form id="new">
    <input type="text" id="title" placeholder="What needs doing?" maxlength="200" required>
    <button type="submit">Add</button>
  </form>
  <div id="error" class="err"></div>
  <ul id="list"></ul>
  <script>
    const list = document.getElementById("list");
    const errorBox = document.getElementById("error");

    async function api(method, path, body) {
      const res = await fetch(path, {
        method,
        headers: body ? { "Content-Type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      if (!res.ok) throw new Error(`${method} ${path} failed: ${res.status}`);
      return res.status === 204 ? null : res.json();
    }

    async function load() {
      try {
        const items = await api("GET", "/api/tasks");
        errorBox.textContent = "";
        list.innerHTML = "";
        for (const t of items) {
          const li = document.createElement("li");
          if (t.done) li.className = "done";
          const box = document.createElement("input");
          box.type = "checkbox";
          box.checked = t.done;
          box.onchange = () => api("PATCH", `/api/tasks/${t.id}`, { done: box.checked }).then(load, showError);
          const span = document.createElement("span");
          span.textContent = t.title;
          const del = document.createElement("button");
          del.textContent = "Delete";
          del.onclick = () => api("DELETE", `/api/tasks/${t.id}`).then(load, showError);
          li.append(box, span, del);
          list.append(li);
        }
      } catch (e) { showError(e); }
    }

    function showError(e) { errorBox.textContent = e.message; }

    document.getElementById("new").onsubmit = async (ev) => {
      ev.preventDefault();
      const input = document.getElementById("title");
      try {
        await api("POST", "/api/tasks", { title: input.value });
        input.value = "";
        load();
      } catch (e) { showError(e); }
    };

    load();
  </script>
</body>
</html>
