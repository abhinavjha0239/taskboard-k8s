# Every change: lint + unit tests and security scans, then build and scan the
# image, deploy that exact image to a throwaway kind cluster with the same
# Makefile used locally, run the user journey and check metrics and traces.
# Only an image that passed all of this is pushed to GHCR, tagged with its commit.
#
# Third-party actions are pinned to commit SHAs (tag in the comment).
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build the PR head commit (not GitHub's merge commit) so the image tag,
  # /version and the reviewed commit are the same SHA.
  COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    name: Lint, unit tests, chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.4
      - run: make test VENV=/tmp/venv

  security:
    name: Secret, dependency and config scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks lists the PR's commits to scan them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
      - name: Secrets in git history (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Known vulnerable dependencies (pip-audit)
        run: pipx run pip-audit -r requirements.txt
      - name: Dockerfile, chart and manifest misconfigurations (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_HELM_SET: image.tag=scan   # the chart requires a tag to render
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  deploy:
    name: Build, scan, deploy to kind, verify
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # GHCR push with the built-in token; no stored credentials
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.4
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          install_only: true
      - run: make cluster
      - run: make build TAG=$COMMIT
      - name: Image vulnerabilities (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: taskboard:${{ env.COMMIT }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - run: make deploy TAG=$COMMIT
      - run: make smoke TAG=$COMMIT | tee smoke.txt
      - run: make drift
      - run: make signals | tee signals.txt
      - name: Push the verified image to GHCR
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${COMMIT}"
          docker tag "taskboard:${COMMIT}" "$image"
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Evidence summary
        if: always()
        run: |
          {
            echo "## Deployment evidence"
            echo "- Commit: \`${COMMIT}\`"
            echo "- Image: \`${IMAGE:-taskboard:${COMMIT} (not pushed)}\`"
            echo '### helm history'; echo '```'; make -s status || true; echo '```'
            echo '### User journey'; echo '```'; cat smoke.txt 2>/dev/null || echo "not run"; echo '```'
            echo '### Signals'; echo '```'; cat signals.txt 2>/dev/null || echo "not run"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n taskboard get all,events --sort-by=.lastTimestamp || true
          kubectl -n taskboard logs -l app.kubernetes.io/name=taskboard --all-containers --tail 100 || true
          kubectl -n observability get pods || true
