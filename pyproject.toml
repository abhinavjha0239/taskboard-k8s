[project]
name = "taskboard"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# S = bandit security rules
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S311"]  # random is only used for fault injection

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
